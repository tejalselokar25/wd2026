<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HTML5 APIs Demo</title>

<style>

body{
    font-family:Arial, sans-serif;
    margin:0;
    padding:0;
    background:linear-gradient(to right,#74ebd5,#ACB6E5);
}

header{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:90%;
    margin:auto;
    padding:20px;
}

.section{
    background:white;
    padding:20px;
    margin-bottom:30px;
    border-radius:15px;
    box-shadow:0 5px 10px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    color:#333;
}

/* Drag and Drop */
#dragBox{
    width:120px;
    height:120px;
    background:orange;
    color:white;
    text-align:center;
    line-height:120px;
    border-radius:10px;
    cursor:grab;
    font-size:20px;
    margin:auto;
}

#dropArea{
    width:250px;
    height:180px;
    border:3px dashed #333;
    margin:30px auto;
    text-align:center;
    line-height:180px;
    font-size:22px;
    border-radius:10px;
    background:#f5f5f5;
}

/* Storage Input */
input{
    padding:10px;
    width:250px;
    border-radius:5px;
    border:1px solid gray;
}

button{
    padding:10px 20px;
    background:#ff5722;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:black;
}

</style>
</head>

<body>

<header>
    <h1>HTML5 APIs Demonstration</h1>
    <p>Drag & Drop, Geolocation and Web Storage API</p>
</header>

<div class="container">

    <!-- Drag and Drop -->
    <div class="section">

        <h2>Drag and Drop API</h2>

        <div id="dragBox" draggable="true" ondragstart="drag(event)">
            Drag Me
        </div>

        <div id="dropArea"
             ondrop="drop(event)"
             ondragover="allowDrop(event)">
             Drop Here
        </div>

    </div>

    <!-- Geolocation -->
    <div class="section">

        <h2>Geolocation API</h2>

        <center>
            <button onclick="getLocation()">Get Location</button>
            <p id="location"></p>
        </center>

    </div>

    <!-- Web Storage -->
    <div class="section">

        <h2>Web Storage API</h2>

        <center>

            <input type="text" id="username" placeholder="Enter Your Name">

            <br><br>

            <button onclick="saveData()">Save in Local Storage</button>

            <button onclick="showData()">Show Saved Data</button>

            <p id="result"></p>

        </center>

    </div>

</div>

<script>

/* Drag and Drop */

function allowDrop(event){
    event.preventDefault();
}

function drag(event){
    event.dataTransfer.setData("text", event.target.id);
}

function drop(event){
    event.preventDefault();

    var data = event.dataTransfer.getData("text");

    event.target.appendChild(document.getElementById(data));

    event.target.innerHTML = "Dropped Successfully!";
}

/* Geolocation */

function getLocation(){

    if(navigator.geolocation){

        navigator.geolocation.getCurrentPosition(showPosition);

    }
    else{
        document.getElementById("location").innerHTML =
        "Geolocation is not supported.";
    }
}

function showPosition(position){

    document.getElementById("location").innerHTML =
    "Latitude: " + position.coords.latitude +
    "<br>Longitude: " + position.coords.longitude;
}

/* Web Storage */

function saveData(){

    var name = document.getElementById("username").value;

    localStorage.setItem("user", name);

    alert("Data Saved Successfully!");
}

function showData(){

    var savedName = localStorage.getItem("user");

    document.getElementById("result").innerHTML =
    "Saved Name: " + savedName;
}

</script>

</body>
</html>
